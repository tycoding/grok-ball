<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grok Ball · AI 表情球</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center;

    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
  * { box-sizing: border-box; }

  .ball { position: fixed; right: 28px; bottom: 28px; width: 72px; height: 72px;
    cursor: pointer; filter: drop-shadow(0 6px 16px rgba(0,0,0,.25)); z-index: 20; }
  .ball svg { display: block; width: 100%; height: 100%; overflow: visible; }

  .topbar { flex: none; width: 100%; max-width: 1360px; padding: 18px 24px 10px;
    display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
  .brand-dot { width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3d3d3d 0%, #1a1a1a 55%, #000 100%);
    box-shadow: 0 2px 5px rgba(0,0,0,.28); }
  .github-link { display: flex; align-items: center; gap: 7px; font-size: 13px;
    color: #57606a; text-decoration: none; transition: color .15s; }
  .github-link:hover { color: #1f2328; }
  .github-link svg { display: block; }

  .panel { flex: 1 1 auto; min-height: 0; width: 100%; max-width: 1360px;
    padding: 8px 24px 24px; display: grid; grid-template-columns: 560px 1fr;
    gap: 24px; align-items: stretch; }

  .card { background: #fff; border: 1px solid #ececec; border-radius: 18px;
    box-shadow: 0 1px 2px rgba(16,24,40,.04); }

  .controls { padding: 20px; display: flex; flex-direction: column; min-height: 0; }
  .controls h2 { margin: 0 0 4px; font-size: 17px; }
  .controls .sub { margin: 0 0 14px; font-size: 12px; color: #9aa0a8; }

  .emo-scroll { overflow-y: auto; flex: 1 1 auto; min-height: 0; padding-right: 6px; margin-right: -6px; }
  .emo-scroll::-webkit-scrollbar { width: 8px; }
  .emo-scroll::-webkit-scrollbar-thumb { background: #e0e2e6; border-radius: 4px; }
  .emo-scroll::-webkit-scrollbar-thumb:hover { background: #c9ccd2; }

  .group { margin-bottom: 2px; }
  .group h3 { margin: 14px 0 8px; font-size: 12px; color: #8a8f98;
    font-weight: 600; letter-spacing: .5px; }

  .emo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .emo-card { display: flex; flex-direction: column; align-items: center; gap: 5px;
    border: 1px solid #eef0f2; background: #fff; border-radius: 12px;
    padding: 10px 2px 8px; cursor: pointer; transition: all .16s; }
  .emo-card:hover { border-color: #d4d7dc; box-shadow: 0 2px 8px rgba(16,24,40,.06); transform: translateY(-1px); }
  .emo-card.active { border-color: #1a1a1a; box-shadow: inset 0 0 0 1px #1a1a1a; }
  .emo-thumb { width: 44px; height: 44px; background: #f3f4f6; border-radius: 50%; }
  .emo-thumb svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .emo-name { font-size: 12px; color: #3a3f47; }
  .emo-card.active .emo-name { font-weight: 600; }

  .divider { height: 1px; background: #f0f0f1; margin: 14px 0; }
  .control-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; }
  .control-row label { flex: 0 0 52px; color: #3a3f47; }
  .control-row select, .control-row input[type=color] {
    height: 30px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fff;
    padding: 0 8px; font-size: 13px; color: #3a3f47; outline: none; }
  .control-row input[type=color] { padding: 2px; width: 44px; cursor: pointer; }
  .control-row input[type=range] { flex: 1; accent-color: #1a1a1a; }

  .preview { padding: 32px 24px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; min-height: 0;
    background: radial-gradient(120% 120% at 50% 40%, #fbfbfc 0%, #f5f6f8 100%); }
  .preview-ball { width: 260px; height: 260px; }
  .preview-name { font-size: 18px; font-weight: 600; margin: 0; }
  .preview-id { font-size: 12px; color: #b8bcc4; margin: 0; }
  .preview-desc { font-size: 13px; color: #8a8f98; text-align: center; max-width: 360px; margin: 0; line-height: 1.6; }

  @media (max-width: 720px) {
    body { height: auto; overflow: auto; align-items: stretch; }
    .panel { grid-template-columns: 1fr; padding: 0 16px 24px; }
    .emo-scroll { overflow: visible; }
    .preview { min-height: 360px; }
    .topbar { padding: 14px 16px 8px; }
  }
</style>

  <script>

    function createBall(el, opts) {
      opts = opts || {};
      var uid = 'gb' + (++seq);
      var autostart = opts.autostart !== false;

      var svgEl = svg('svg', { viewBox: '-130 -130 260 260', width: '100%', height: '100%', role: 'img' });

      svgEl.style.overflow = 'visible';

      var defs = svg('defs', {});
      var grad = svg('radialGradient', { id: uid + 'g', cx: '38%', cy: '30%', r: '80%' });
      var stopA = svg('stop', { offset: '0%' });
      var stopB = svg('stop', { offset: '60%' });
      var stopC = svg('stop', { offset: '100%' });

      defs.appendChild(grad);
      svgEl.appendChild(defs);

      var fxBack = svg('g', {});

      var bodyG = svg('g', {});

      var fx = null; /* 当前特效实例 */

        stopB.setAttribute('stop-color', c);
        stopC.setAttribute('stop-color', tone(c, -0.14));

      function startFx() {

      function clearFx() {
        if (fx && fx.clear) fx.clear();
        fx = null;
      }

      /* 思考环带：一个环绕头顶旋转的椭圆 */
      function makeOrbit() {
        var ring = svg('ellipse', { rx: 120, ry: 40, fill: 'none', stroke: '#7aa5ff', 'stroke-width': 6, 'stroke-linecap': 'round', opacity: 0 });
        fxBack.appendChild(ring);

          }
        };

          clear: function () { zs.forEach(function (t) { t.remove(); }); },
          step: function (dt, now) {
            for (var i = 0; i < 3; i++) {

              zs[i].setAttribute('opacity', o.toFixed(2));
              zs[i].setAttribute('font-size', (14 + p * 12).toFixed(0));
              zs[i].setAttribute('transform', 'translate(' + (60 + p * 40) + ' ' + (-62 - p * 46) + ')');
            }
          }
        };
      }

      /* 撒花：一次性粒子爆发 */
      function makeConfetti() {
        var COLORS = ['#f9705c', '#5b95f0', '#3fbe86', '#f5b13f', '#9a72ee', '#35c3bd'];
        var parts = [];
        for (var i = 0; i < 22; i++) {
          var star = Math.random() < 0.2;
          var n = star
            ? svg('path', { d: starPath(), fill: '#f4c34e' })
            : svg('circle', { r: rand(2, 4), fill: COLORS[(Math.random() * COLORS.length) | 0] });
          fxFront.appendChild(n);
          var a = rand(0, TAU), spd = rand(120, 300);
          parts.push({ n: n, x: 0, y: 0, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 60, life: 0, max: rand(0.5, 0.9), rot: rand(0, 360), vr: rand(-300, 300), r: star ? rand(5, 8) : 1 });
        }
        return {
          clear: function () { parts.forEach(function (p) { p.n.remove(); }); },
          step: function (dt) {
            for (var i = parts.length - 1; i >= 0; i--) {
              var p = parts[i];
              p.life += dt;
              if (p.life >= p.max) { p.n.remove(); parts.splice(i, 1); continue; }
              p.x += p.vx * dt; p.y += p.vy * dt;
              p.vy = p.vy * Math.pow(0.94, 60 * dt) + 40 * dt;
              p.rot += p.vr * dt;
              var u = p.life / p.max;
              var fd = u < 0.1 ? u / 0.1 : Math.pow(1 - (u - 0.1) / 0.9, 1.6);
              var sz = Math.max(p.r * (1 - 0.4 * u), 0.5);
              p.n.setAttribute('opacity', fd.toFixed(2));
              p.n.setAttribute('transform', 'translate(' + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ') rotate(' + p.rot.toFixed(0) + ') scale(' + sz.toFixed(2) + ')');
            }
          }
        };
      }
      function starPath() {
        var pts = [];
        for (var e = 0; e < 10; e++) {
          var a = -Math.PI / 2 + e * Math.PI / 5;
          var r = e % 2 === 0 ? 1 : 0.42;
          pts.push((Math.cos(a) * r).toFixed(3) + ' ' + (Math.sin(a) * r).toFixed(3));
        }
        return 'M' + pts.join('L') + 'Z';
      }

      function setEmotion(id, skipFx) {
        var e = null;
        for (var i = 0; i < EMOTIONS.length; i++) if (EMOTIONS[i].id === id) e = EMOTIONS[i];
        if (!e) e = EMOTIONS[1] || EMOTIONS[0];
        cur = e;
        colorFrom = curColor;
        targetColor = e.color;
        colorAt = 0;
        blinkAt = performance.now();
        blinkNext = e.blink ? blinkAt + rand(e.blink[0], e.blink[1]) : Infinity;
        altBlink = !!e.altBlink;
        if (!skipFx) startFx();
      }

      function setGaze(nx, ny) { gazeTX = clamp(nx, -1, 1); gazeTY = clamp(ny, -1, 1); }
      function clearGaze() { gazeTX = 0; gazeTY = 0; }

      function applyFrame(now, dt) {
        var e = cur || EMOTIONS[1];
        var t = now - bornAt;
        var rt = (now - blinkAt) / 1000;

        /* 注视平滑 */
        var k = 1 - Math.exp(-5.6 * dt);
        gazeX += (gazeTX - gazeX) * k;
        gazeY += (gazeTY - gazeY) * k;

        /* 颜色过渡 */
        colorAt = Math.min(colorAt + dt / 0.35, 1);
        curColor = colorAt >= 1 ? targetColor : mix(colorFrom, targetColor, colorAt);
        setBodyColor(curColor);
        if (opts.color) { setBodyColor(opts.color); curColor = opts.color; }

        /* 眨眼 */
        if (e.blink && now >= blinkNext) {
          blinkStart = now;
          blinkNext = now + rand(e.blink[0], e.blink[1]);
        }
        var bd = e.blink ? (now - blinkStart) : 1e9;
        var blink = 1;
        if (bd < 160) blink = Math.abs(Math.sin(Math.PI * bd / 160));
        blink = Math.max(blink, 0.04);
        var blinkL = blink;
        var blinkR = altBlink ? (bd < 160 ? blink : 1) : blink;
        if (altBlink && bd >= 160 && bd < 320) blinkR = Math.max(Math.abs(Math.sin(Math.PI * bd / 160)), 0.04);

        /* 呼吸 */
        var breathe = e.breathe || 0;
        var bs = 1 + breathe * Math.sin(now / 1000 * 1.15);

        /* 浮动 / 点头 / 摇头 */
        var bob = 0;
        if (e.bob) bob = e.bob * Math.sin(TAU * t / (e.bobPer || 1400));
        var shake = 0;
        if (e.shake) shake = e.shake * Math.exp(-rt * 2.2) * Math.sin(rt * 30 + shakeSeed);
        var nod = 0;
        if (e.nod) nod = Math.sin(TAU * t / 1600) * 7 * Math.exp(-rt * 1.5);

        /* 扫描 / 抖动目光 */
        var scanX = 0, scanY = 0, dart = 0;
        if (e.scan) scanX = e.scan * (function () { var p = (t % e.scanPer) / e.scanPer; return p < 0.5 ? p * 4 - 1 : 3 - p * 4; })();
        if (e.scanY) scanY = e.scanY * Math.sin(TAU * t / e.scanPer);
        if (e.dart) { dart = (Math.sin(t / 90) + Math.sin(t / 150)) / 2 * 4; }

        /* 缩放脉冲 */
        var pulse = 1;
        if (e.pulse) pulse = 1 + e.pulse * 0.5 * (1 - Math.cos(TAU * t / e.pulsePer));

        /* 颜色闪烁 */
        var fl = 0;
        if (e.flash) {
          var idx = Math.floor(rt * 4) % e.flash.length;
          if (idx >= 0) setBodyColor(e.flash[idx]);
        }

        var eyeScale = (e.scale || 1) * (opts.eyeScale || 1) * pulse;
        var gx = e.gaze === false ? 0 : (e.lookX || 0) + gazeX * 16 + scanX + dart;
        var gy = e.gaze === false ? 0 : (e.lookY || 0) + gazeY * 10 + scanY;
        var compress = 1 - 0.06 * Math.abs(gx) / 16;

        /* 左右眼注视内聚（专注） */
        var convergeL = e.focus ? 3 : 0, convergeR = e.focus ? -3 : 0;

        var tilt = (e.tilt || 0) + nod;
        bodyG.setAttribute('transform',
          'translate(' + (shake).toFixed(1) + ' ' + (bob + (e.lookY && !e.gaze ? 0 : 0)).toFixed(1) + ')' +
          ' rotate(' + tilt.toFixed(1) + ') scale(' + (bs * pulse).toFixed(3) + ')');

        function place(path, px, py, shapeKey, right, blk, cv) {
          drawEye(path, shapeKey, right);
          var sx = eyeScale * compress * (right ? -1 : 1);
          var sy = eyeScale * blk;
          var ox = px + gx + cv;
          path.setAttribute('transform',
            'translate(' + ox.toFixed(1) + ' ' + (py + gy).toFixed(1) + ')' +
            ' scale(' + sx.toFixed(3) + ' ' + sy.toFixed(3) + ')');
        }
        place(eyeL, P.lx, P.ly, e.eyeL || e.eye, false, blinkL, convergeL);
        place(eyeR, P.rx, P.ry, e.eyeR || e.eye, true, blinkR, convergeR);

        if (fx) fx.step(dt, t);
      }

      function loop(now) {
        var dt = lastNow ? clamp((now - lastNow) / 1000, 0.001, 0.05) : 1 / 60;
        lastNow = now;
        applyFrame(now, dt);
        rafId = requestAnimationFrame(loop);
      }

      setEmotion(opts.emotion || '02', true);
      if (autostart) rafId = requestAnimationFrame(loop);
      else applyFrame(performance.now(), 1 / 60);

      return {
        setEmotion: function (id) { setEmotion(id); },
        setGaze: setGaze,
        clearGaze: clearGaze,
        destroy: function () {
          if (rafId) cancelAnimationFrame(rafId);
          clearFx();
          if (svgEl.parentNode) svgEl.parentNode.removeChild(svgEl);
        }
      };
    }

    window.GrokBall = { create: createBall, EMOTIONS: EMOTIONS, GROUPS: GROUPS };
  })();
  </script>

  <script>
  (function () {
    'use strict';
    var GROUPS = window.GrokBall.GROUPS;
    var EMOTIONS = window.GrokBall.EMOTIONS;

    var controlsEl = document.getElementById('controls');
    var previewBox = document.getElementById('previewBall');
    var cornerEl = document.getElementById('ball');
    var nameEl = document.getElementById('previewName');
    var idEl = document.getElementById('previewId');
    var descEl = document.getElementById('previewDesc');
    var colorMode = document.getElementById('colorMode');
    var colorInput = document.getElementById('colorInput');
    var sizeRange = document.getElementById('sizeRange');

    var currentId = '02';
    var engine = null;
    var cornerEngine = null;

    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function pickEye(hex) {
      var n = parseInt(hex.slice(1), 16);
      var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      return (0.299 * r + 0.587 * g + 0.114 * b) < 140 ? '#f5f5f5' : '#1a1a1a';
    }

    cornerEngine = GrokBall.create(cornerEl, { emotion: '02', color: '#1a1a1a', eyeColor: '#f5f5f5' });
    cornerEl.addEventListener('pointerdown', function () {
      cornerEngine.setEmotion('33');
      setTimeout(function () { cornerEngine.setEmotion('02'); }, 1600);
    });

    GROUPS.forEach(function (g) {
      var items = EMOTIONS.filter(function (s) { return s.group === g.key; });
      if (!items.length) return;
      var sec = document.createElement('div');
      sec.className = 'group';
      var h = document.createElement('h3');
      h.textContent = g.name;
      sec.appendChild(h);
      var grid = document.createElement('div');
      grid.className = 'emo-grid';
      items.forEach(function (s) {
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'emo-card';
        card.dataset.id = s.id;
        var thumb = document.createElement('div');
        thumb.className = 'emo-thumb';
        card.appendChild(thumb);
        var nm = document.createElement('span');
        nm.className = 'emo-name';
        nm.textContent = s.name;
        card.appendChild(nm);
        card.addEventListener('click', function () { select(s); });
        grid.appendChild(card);
        GrokBall.create(thumb, { emotion: s.id, autostart: false, eyeScale: 1.4 });
      });
      sec.appendChild(grid);
      controlsEl.appendChild(sec);
    });

    function rebuild() {
      var opts = { emotion: currentId };
      if (colorMode.value === 'custom') {
        opts.color = colorInput.value;
        opts.eyeColor = pickEye(colorInput.value);
      }
      if (engine) engine.destroy();
      engine = GrokBall.create(previewBox, opts);
    }

    function select(s) {
      currentId = s.id;
      var cards = controlsEl.querySelectorAll('.emo-card');
      for (var i = 0; i < cards.length; i++) cards[i].classList.toggle('active', cards[i].dataset.id === s.id);
      nameEl.textContent = s.name;
      idEl.textContent = 'ID ' + s.id;
      descEl.textContent = s.desc || '';
      if (engine && colorMode.value === 'auto') engine.setEmotion(s.id);
      else rebuild();
    }

    colorMode.addEventListener('change', rebuild);
    colorInput.addEventListener('change', function () { if (colorMode.value === 'custom') rebuild(); });
    sizeRange.addEventListener('input', function () {
      previewBox.style.width = sizeRange.value + 'px';
      previewBox.style.height = sizeRange.value + 'px';
    });

    function gazeOn(eng, el, e) {
      if (!eng) return;
      var r = el.getBoundingClientRect();
      if (!r.width || !r.height) return;
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      eng.setGaze(
        clamp((e.clientX - cx) / (r.width / 2), -1, 1),
        clamp((e.clientY - cy) / (r.height / 2), -1, 1));
    }
    window.addEventListener('pointermove', function (e) {
      gazeOn(engine, previewBox, e);
      gazeOn(cornerEngine, cornerEl, e);
    }, { passive: true });
    document.addEventListener('pointerleave', function () {
      if (engine) engine.clearGaze();
      if (cornerEngine) cornerEngine.clearGaze();
    });

    rebuild();
    var first = EMOTIONS.filter(function (s) { return s.id === currentId; })[0] || EMOTIONS[0];
    select(first);
  })();
  </script>
</body>
