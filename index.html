<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grok Ball · AI 表情球</title>
<style>
  :root {
    --ink: #111516;
    --ink-soft: #171c1d;
    --ink-line: #2b3333;
    --paper: #f2efe8;
    --paper-raised: #faf8f3;
    --paper-inset: #e8e5dc;
    --paper-line: #d7d4cc;
    --text: #1c2525;
    --muted: #737a76;
    --quiet: #9aa09a;
    --accent: #8fd8c8;
    --accent-deep: #196257;
    --danger: #d46657;
    --radius-panel: 20px;
    --radius-control: 10px;
    --ease-out: cubic-bezier(.23,1,.32,1);
  }

  html, body { height: 100%; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center;
    overflow: hidden; background: var(--ink); color: #f4f1e9;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    letter-spacing: 0;
  }
  * { box-sizing: border-box; }

  .ball {
    position: fixed; right: 30px; bottom: 28px; width: 74px; height: 74px;
    cursor: pointer; filter: drop-shadow(0 12px 22px rgba(0,0,0,.42)); z-index: 20;
    transition: filter .18s var(--ease-out), transform .18s var(--ease-out);
  }
  .ball:hover { filter: drop-shadow(0 15px 26px rgba(0,0,0,.55)); transform: translateY(-2px); }
  .ball:active { transform: scale(.97); }
  .ball svg { display: block; width: 100%; height: 100%; overflow: visible; }

  .topbar {
    flex: none; width: 100%; max-width: 1440px; padding: 24px 30px 18px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 11px; font-size: 18px; font-weight: 680; letter-spacing: -.02em; }
  .brand-dot {
    width: 24px; height: 24px; border-radius: 8px 50% 50% 50%; transform: rotate(-18deg);
    background: #f5f0e7; box-shadow: 0 0 0 5px rgba(143,216,200,.08), 0 5px 14px rgba(0,0,0,.3);
  }
  .github-link {
    display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 11px;
    border: 1px solid var(--ink-line); border-radius: 9px; color: #aeb9b5; text-decoration: none;
    font-size: 12px; transition: color .14s ease, border-color .14s ease, background-color .14s ease;
  }
  .github-link:hover { color: #f5f1e9; border-color: #52615f; background: #1d2424; }
  .github-link svg { display: block; }

  .panel {
    flex: 1 1 auto; min-height: 0; width: 100%; max-width: 1440px;
    padding: 4px 30px 30px; display: grid; grid-template-columns: minmax(430px, 500px) minmax(0, 1fr);
    gap: 18px; align-items: stretch;
  }

  .card { border-radius: var(--radius-panel); overflow: hidden; }

  .controls {
    padding: 24px; display: flex; flex-direction: column; min-height: 0;
    color: var(--text); background: var(--paper); border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 18px 42px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.62);
  }
  .controls h2 { margin: 0; font-size: 18px; font-weight: 680; letter-spacing: -.03em; }
  .controls .sub { margin: 6px 0 16px; font-size: 12px; color: var(--muted); line-height: 1.5; }

  .emo-scroll { overflow-y: auto; flex: 1 1 auto; min-height: 0; padding: 2px 7px 4px 1px; margin-right: -7px; }
  .emo-scroll::-webkit-scrollbar { width: 6px; }
  .emo-scroll::-webkit-scrollbar-track { background: transparent; }
  .emo-scroll::-webkit-scrollbar-thumb { background: #c8c5bc; border-radius: 6px; }
  .emo-scroll::-webkit-scrollbar-thumb:hover { background: #aaa89f; }

  .group { margin-bottom: 3px; }
  .group h3 {
    display: flex; align-items: center; gap: 9px; margin: 15px 0 9px; font-size: 10px;
    color: #727a75; font-weight: 750; letter-spacing: .14em; text-transform: uppercase;
  }
  .group h3::after { content: ""; height: 1px; flex: 1; background: var(--paper-line); }

  .emo-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .emo-card {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px;
    min-width: 0; border: 1px solid transparent; background: rgba(250,248,243,.54); border-radius: var(--radius-control);
    padding: 9px 3px 8px; color: var(--text); cursor: pointer;
    transition: background-color .14s ease, border-color .14s ease, box-shadow .14s ease, color .14s ease;
  }
  .emo-card:hover { background: var(--paper-raised); border-color: #cbc8bf; box-shadow: 0 5px 13px rgba(31,37,35,.08); }
  .emo-card:focus-visible { outline: 2px solid var(--accent-deep); outline-offset: 2px; }
  .emo-card:active { transform: scale(.985); }
  .emo-card.active {
    background: #e2f2ed; border-color: #83cfc0; color: #174e47;
    box-shadow: inset 0 0 0 1px rgba(25,98,87,.18), 0 5px 14px rgba(25,98,87,.1);
  }
  .emo-thumb { width: 46px; height: 46px; background: var(--paper-inset); border-radius: 50%; transition: background-color .14s ease; }
  .emo-card:hover .emo-thumb { background: #e1ded6; }
  .emo-card.active .emo-thumb { background: #d3ebe4; }
  .emo-thumb svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .emo-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: #4b5550; }
  .emo-card.active .emo-name { color: var(--accent-deep); font-weight: 700; }

  .divider { height: 1px; background: var(--paper-line); margin: 16px 0 4px; }
  .control-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 12px; }
  .control-row label { flex: 0 0 36px; color: #5d6761; font-weight: 650; }
  .control-row select, .control-row input[type=color] {
    height: 32px; border: 1px solid #d5d2ca; border-radius: var(--radius-control); background: var(--paper-raised);
    padding: 0 10px; font-size: 12px; color: var(--text); outline: none;
    transition: border-color .14s ease, box-shadow .14s ease, background-color .14s ease;
  }
  .control-row select { min-width: 112px; cursor: pointer; }
  .control-row select:hover, .control-row input[type=color]:hover { border-color: #b4b4aa; }
  .control-row select:focus-visible, .control-row input[type=color]:focus-visible {
    border-color: var(--accent-deep); box-shadow: 0 0 0 3px rgba(143,216,200,.24);
  }
  .control-row input[type=color] { padding: 3px; width: 42px; cursor: pointer; }
  .control-row input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent-deep); cursor: pointer; }

  .preview {
    position: relative; padding: 32px 24px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; min-height: 0; isolation: isolate;
    background-color: var(--ink-soft); border: 1px solid var(--ink-line);
    box-shadow: 0 18px 42px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.04);
  }
  .preview::before {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: .56;
    background-image: linear-gradient(rgba(143,216,200,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(143,216,200,.055) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,.8), transparent 78%);
  }
  .preview::after {
    content: "LIVE / SVG RENDER"; position: absolute; top: 24px; right: 26px; color: #788680;
    font: 700 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .14em;
  }
  .preview-ball { width: min(38vw, 300px); height: min(38vw, 300px); filter: drop-shadow(0 24px 34px rgba(0,0,0,.28)); }
  .preview-name { font-size: 20px; font-weight: 680; letter-spacing: -.03em; color: #f4f0e8; margin: 0; }
  .preview-id { font: 700 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; color: #78928c; margin: 0; }
  .preview-desc { font-size: 12px; color: #a8b3ad; text-align: center; max-width: 390px; margin: 0; line-height: 1.7; }

  @media (max-width: 900px) {
    .panel { grid-template-columns: minmax(360px, 430px) minmax(0, 1fr); padding-left: 20px; padding-right: 20px; }
    .topbar { padding-left: 20px; padding-right: 20px; }
    .preview-ball { width: min(34vw, 260px); height: min(34vw, 260px); }
  }
  @media (max-width: 720px) {
    body { height: auto; min-height: 100vh; overflow: auto; align-items: stretch; }
    .topbar { padding: 18px 16px 14px; }
    .github-link { max-width: 34px; padding: 0 8px; overflow: hidden; white-space: nowrap; }
    .github-link span { display: none; }
    .panel { grid-template-columns: 1fr; padding: 0 12px 18px; gap: 12px; }
    .controls { padding: 18px; min-height: 470px; }
    .emo-scroll { overflow: visible; }
    .preview { min-height: 490px; padding: 40px 18px 28px; }
    .preview::after { top: 18px; right: 18px; }
    .preview-ball { width: min(72vw, 280px); height: min(72vw, 280px); }
    .preview-desc { max-width: 320px; }
    .ball { right: 18px; bottom: 18px; width: 64px; height: 64px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>

  <script>
  (function () {
    'use strict';
    var GROUPS = window.GrokBall.GROUPS;
    var EMOTIONS = window.GrokBall.EMOTIONS;

    var controlsEl = document.getElementById('controls');
    var previewBox = document.getElementById('previewBall');
    var cornerEl = document.getElementById('ball');
    var nameEl = document.getElementById('previewName');
    var idEl = document.getElementById('previewId');
    var descEl = document.getElementById('previewDesc');
    var colorMode = document.getElementById('colorMode');
    var colorInput = document.getElementById('colorInput');
    var sizeRange = document.getElementById('sizeRange');

    var currentId = '02';
    var engine = null;
    var cornerEngine = null;

    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function pickEye(hex) {
      var n = parseInt(hex.slice(1), 16);
      var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      return (0.299 * r + 0.587 * g + 0.114 * b) < 140 ? '#f5f5f5' : '#1a1a1a';
    }

    cornerEngine = GrokBall.create(cornerEl, { emotion: '02', color: '#1a1a1a', eyeColor: '#f5f5f5' });
    cornerEl.addEventListener('pointerdown', function () { cornerEngine.spin(1); });

    GROUPS.forEach(function (g) {
      var items = EMOTIONS.filter(function (s) { return s.group === g.key; });
      if (!items.length) return;
      var sec = document.createElement('div');
      sec.className = 'group';
      var h = document.createElement('h3');
      h.textContent = g.name;
      sec.appendChild(h);
      var grid = document.createElement('div');
      grid.className = 'emo-grid';
      items.forEach(function (s) {
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'emo-card';
        card.dataset.id = s.id;
        var thumb = document.createElement('div');
        thumb.className = 'emo-thumb';
        card.appendChild(thumb);
        var nm = document.createElement('span');
        nm.className = 'emo-name';
        nm.textContent = s.name;
        card.appendChild(nm);
        card.addEventListener('click', function () { select(s); });
        grid.appendChild(card);
        GrokBall.create(thumb, { emotion: s.id, autostart: false, eyeScale: 1.4 });
      });
      sec.appendChild(grid);
      controlsEl.appendChild(sec);
    });

    function rebuild() {
      var opts = { emotion: currentId };
      if (colorMode.value === 'custom') {
        opts.color = colorInput.value;
        opts.eyeColor = pickEye(colorInput.value);
      }
      if (engine) engine.destroy();
      engine = GrokBall.create(previewBox, opts);
    }

    function select(s) {
      currentId = s.id;
      var cards = controlsEl.querySelectorAll('.emo-card');
      for (var i = 0; i < cards.length; i++) cards[i].classList.toggle('active', cards[i].dataset.id === s.id);
      nameEl.textContent = s.name;
      idEl.textContent = 'ID ' + s.id;
      descEl.textContent = s.desc || '';
      if (engine && colorMode.value === 'auto') engine.setEmotion(s.id);
      else rebuild();
    }

    colorMode.addEventListener('change', rebuild);
    colorInput.addEventListener('change', function () { if (colorMode.value === 'custom') rebuild(); });
    sizeRange.addEventListener('input', function () {
      previewBox.style.width = sizeRange.value + 'px';
      previewBox.style.height = sizeRange.value + 'px';
    });

    function gazeOn(eng, el, e) {
      if (!eng) return;
      var r = el.getBoundingClientRect();
      if (!r.width || !r.height) return;
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      eng.setGaze(
        clamp((e.clientX - cx) / (r.width / 2), -1, 1),
        clamp((e.clientY - cy) / (r.height / 2), -1, 1));
    }
    window.addEventListener('pointermove', function (e) {
      gazeOn(engine, previewBox, e);
      gazeOn(cornerEngine, cornerEl, e);
    }, { passive: true });
    document.addEventListener('pointerleave', function () {
      if (engine) engine.clearGaze();
      if (cornerEngine) cornerEngine.clearGaze();
    });

    rebuild();
    var first = EMOTIONS.filter(function (s) { return s.id === currentId; })[0] || EMOTIONS[0];
    select(first);
  })();
  </script>
</body>
