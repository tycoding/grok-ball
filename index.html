<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grok Ball · AI 表情球</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center;
    overflow: hidden; background: #f4f5f7; color: #1f2328;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
  * { box-sizing: border-box; }

  .ball { position: fixed; right: 28px; bottom: 28px; width: 72px; height: 72px;
    cursor: pointer; filter: drop-shadow(0 6px 16px rgba(0,0,0,.25)); z-index: 20; }
  .ball svg { display: block; width: 100%; height: 100%; overflow: visible; }

  .topbar { flex: none; width: 100%; max-width: 1360px; padding: 18px 24px 10px;
    display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
  .brand-dot { width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3d3d3d 0%, #1a1a1a 55%, #000 100%);
    box-shadow: 0 2px 5px rgba(0,0,0,.28); }
  .github-link { display: flex; align-items: center; gap: 7px; font-size: 13px;
    color: #57606a; text-decoration: none; transition: color .15s; }
  .github-link:hover { color: #1f2328; }
  .github-link svg { display: block; }

  .panel { flex: 1 1 auto; min-height: 0; width: 100%; max-width: 1360px;
    padding: 8px 24px 24px; display: grid; grid-template-columns: 560px 1fr;
    gap: 24px; align-items: stretch; }

  .card { background: #fff; border: 1px solid #ececec; border-radius: 18px;
    box-shadow: 0 1px 2px rgba(16,24,40,.04); }

  .controls { padding: 20px; display: flex; flex-direction: column; min-height: 0; }
  .controls h2 { margin: 0 0 4px; font-size: 17px; }
  .controls .sub { margin: 0 0 14px; font-size: 12px; color: #9aa0a8; }

  .emo-scroll { overflow-y: auto; flex: 1 1 auto; min-height: 0; padding-right: 6px; margin-right: -6px; }
  .emo-scroll::-webkit-scrollbar { width: 8px; }
  .emo-scroll::-webkit-scrollbar-thumb { background: #e0e2e6; border-radius: 4px; }
  .emo-scroll::-webkit-scrollbar-thumb:hover { background: #c9ccd2; }

  .group { margin-bottom: 2px; }
  .group h3 { margin: 14px 0 8px; font-size: 12px; color: #8a8f98;
    font-weight: 600; letter-spacing: .5px; }

  .emo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .emo-card { display: flex; flex-direction: column; align-items: center; gap: 5px;
    border: 1px solid #eef0f2; background: #fff; border-radius: 12px;
    padding: 10px 2px 8px; cursor: pointer; transition: all .16s; }
  .emo-card:hover { border-color: #d4d7dc; box-shadow: 0 2px 8px rgba(16,24,40,.06); transform: translateY(-1px); }
  .emo-card.active { border-color: #1a1a1a; box-shadow: inset 0 0 0 1px #1a1a1a; }
  .emo-thumb { width: 44px; height: 44px; background: #f3f4f6; border-radius: 50%; }
  .emo-thumb svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .emo-name { font-size: 12px; color: #3a3f47; }
  .emo-card.active .emo-name { font-weight: 600; }

  .divider { height: 1px; background: #f0f0f1; margin: 14px 0; }
  .control-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; }
  .control-row label { flex: 0 0 52px; color: #3a3f47; }
  .control-row select, .control-row input[type=color] {
    height: 30px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fff;
    padding: 0 8px; font-size: 13px; color: #3a3f47; outline: none; }
  .control-row input[type=color] { padding: 2px; width: 44px; cursor: pointer; }
  .control-row input[type=range] { flex: 1; accent-color: #1a1a1a; }

  .preview { padding: 32px 24px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; min-height: 0;
    background: radial-gradient(120% 120% at 50% 40%, #fbfbfc 0%, #f5f6f8 100%); }
  .preview-ball { width: 260px; height: 260px; }
  .preview-name { font-size: 18px; font-weight: 600; margin: 0; }
  .preview-id { font-size: 12px; color: #b8bcc4; margin: 0; }
  .preview-desc { font-size: 13px; color: #8a8f98; text-align: center; max-width: 360px; margin: 0; line-height: 1.6; }

  @media (max-width: 720px) {
    body { height: auto; overflow: auto; align-items: stretch; }
    .panel { grid-template-columns: 1fr; padding: 0 16px 24px; }
    .emo-scroll { overflow: visible; }
    .preview { min-height: 360px; }
    .topbar { padding: 14px 16px 8px; }
  }
</style>

  <script>
  (function () {
    'use strict';
    var SVGNS = 'http://www.w3.org/2000/svg';
    var TAU = Math.PI * 2;
    var seq = 0;

    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function rand(a, b) { return a + Math.random() * (b - a); }
    function hex2rgb(hex) {
      var n = parseInt(hex.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    function mix(a, b, t) {
      var A = hex2rgb(a), B = hex2rgb(b);
      return '#' + A.map(function (v, i) {
        return Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0');
      }).join('');
    }
    function tone(hex, amt) {
      var c = hex2rgb(hex), t = amt < 0 ? 0 : 255, a = Math.abs(amt);
      return '#' + c.map(function (v) {
        return Math.round(v + (t - v) * a).toString(16).padStart(2, '0');
      }).join('');
    }
    function svg(tag, attrs) {
      var n = document.createElementNS(SVGNS, tag);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      return n;
    }

    /* 竖向细长杏仁眼（局部坐标中心 0,0，两端略尖、中段圆润） */
    function almond(hw, hh) {

        ' C ' + hw + ' ' + (-hh * 0.7) + ', ' + hw + ' ' + (hh * 0.5) + ', 0 ' + hh +
        ' C ' + (-hw) + ' ' + (hh * 0.5) + ', ' + (-hw) + ' ' + (-hh * 0.7) + ', 0 ' + (-hh) + ' Z';
    }

    var SHAPES = {

      { id: '30', group: 'agent', name: '思考中', desc: '眼睛向上翻，头顶一条彩色光环环绕旋转', eye: 'focus', color: '#F3F0EA', breathe: 0.01, blink: [3500, 7000], lookY: -9, fx: 'orbit' },
      { id: '31', group: 'agent', name: '接收任务', desc: '轻轻点一下头，确认收到', eye: 'open', color: '#F3F0EA', breathe: 0.008, blink: null, bob: 4, bobPer: 900 },
      { id: '32', group: 'agent', name: '处理中忙碌', desc: '细长的眼睛快速左右扫动', eye: 'focus', color: '#F3F0EA', breathe: 0.008, blink: [3200, 6000], scan: 10, scanPer: 1200 },
      { id: '33', group: 'agent', name: '任务完成', desc: '笑眼 + 彩带环绕 + 撒花庆祝', eye: 'smile', color: '#F6EFE4', breathe: 0.012, blink: [2500, 5000], fx: 'confetti', spin: 2 },

      { id: '37', group: 'agent', name: '复述回忆', desc: '目光飘向上方，翻检记忆', eye: 'focus', color: '#F2EFE8', breathe: 0.009, blink: null, lookY: -9, lookX: 3 },

      { id: '39', group: 'agent', name: '输出回复', desc: '眼睛随输出节奏轻轻缩放', eye: 'open', color: '#F3F0EA', breathe: 0.008, blink: null, pulse: 0.1, pulsePer: 680 },
      { id: '40', group: 'agent', name: '检索资料', desc: '眼睛快速左右扫动，高速检索', eye: 'wide', color: '#F3F0EA', breathe: 0.006, blink: [2000, 4000], scan: 12, scanPer: 700 },
      { id: '41', group: 'agent', name: '停止终止', desc: '眼睛慢慢收小半闭后定格', eye: 'closed', color: '#EBE8E2', breathe: 0.004, blink: null, gaze: false, scale: 0.85, lookY: 3 }
    ];

    /* ---------------- 彩色丝带系统：椭圆轨道弧 + 5-stop 色相漂移渐变 ---------------- */
    function makeRibbons(defs, layer) {
      var items = [];
      var uid = 0;
      return {
        spawn: function (cfg) {
          if (items.length > 6) return;
          var gid = 'rb' + (++seq);
          var grad = svg('linearGradient', { id: gid, gradientUnits: 'userSpaceOnUse' });
          var stops = [];
          for (var i = 0; i < 5; i++) { var st = svg('stop', { offset: (i / 4).toFixed(3) }); grad.appendChild(st); stops.push(st); }
          defs.appendChild(grad);
          var p = svg('path', { fill: 'none', stroke: 'url(#' + gid + ')', 'stroke-linecap': 'round' });
          layer.appendChild(p);
          items.push({
            lam: cfg.lam, vel: cfg.vel, span: cfg.span, rx: cfg.rx, ry: cfg.ry, w: cfg.w,
            hue: cfg.hue, hueSpan: cfg.hueSpan, hueVel: cfg.hueVel,
            persistent: !!cfg.persistent, life: 0, max: cfg.max || 2,
            p: p, grad: grad, stops: stops
          });
        },
        step: function (dt) {
          for (var i = items.length - 1; i >= 0; i--) {
            var r = items[i];
            r.life += dt;
            r.lam += r.vel * dt;
            if (!r.persistent) r.vel *= Math.exp(-1.6 * dt);
            if (!r.persistent && r.life > r.max) { r.p.remove(); r.grad.remove(); items.splice(i, 1); continue; }
            var grow = Math.min(r.life / 0.3, 1);
            grow = grow * grow * (3 - 2 * grow);
            var fade = r.persistent ? 0.85 : Math.min(r.life / 0.2, 1) * Math.max(0, 1 - (r.life - r.max + 0.5) / 0.5);
            var a0 = r.lam - r.span, a1 = r.lam;
            var x0 = r.rx * Math.cos(a0), y0 = r.ry * Math.sin(a0);
            var x1 = r.rx * Math.cos(a1), y1 = r.ry * Math.sin(a1);
            var large = Math.abs(r.span) > Math.PI ? 1 : 0;
            var sweep = r.span > 0 ? 1 : 0;
            r.p.setAttribute('d', 'M' + x0.toFixed(1) + ' ' + y0.toFixed(1) + ' A ' + r.rx + ' ' + r.ry + ' 0 ' + large + ' ' + sweep + ' ' + x1.toFixed(1) + ' ' + y1.toFixed(1));
            r.p.setAttribute('stroke-width', (r.w * grow).toFixed(1));
            r.p.setAttribute('opacity', fade.toFixed(2));
            var hue = r.hue + r.hueVel * r.life;
            for (var s = 0; s < 5; s++) {
              var f = s / 4;
              var hv = hue + f * r.hueSpan;
              r.stops[s].setAttribute('stop-color', 'hsl(' + (((hv % 360) + 360) % 360).toFixed(0) + ' 72% ' + (52 + 16 * f).toFixed(0) + '%)');
            }
            r.grad.setAttribute('x1', x0.toFixed(1)); r.grad.setAttribute('y1', y0.toFixed(1));
            r.grad.setAttribute('x2', x1.toFixed(1)); r.grad.setAttribute('y2', y1.toFixed(1));
          }
        },
        clear: function () {
          items.forEach(function (r) { r.p.remove(); r.grad.remove(); });
          items = [];
        }
      };
    }

    /* 撒花粒子 */
    function makeConfetti(layer) {
      var COLORS = ['#f9705c', '#5b95f0', '#3fbe86', '#f5b13f', '#9a72ee', '#35c3bd'];
      var parts = [];
      for (var i = 0; i < 24; i++) {
        var star = Math.random() < 0.22;
        var n = star ? svg('path', { d: starPath(), fill: '#f4c34e' }) : svg('circle', { r: rand(2, 4), fill: COLORS[(Math.random() * COLORS.length) | 0] });
        layer.appendChild(n);
        var a = rand(0, TAU), spd = rand(120, 320);
        parts.push({ n: n, x: 0, y: 0, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 60, life: 0, max: rand(0.5, 0.9), rot: rand(0, 360), vr: rand(-300, 300), r: star ? rand(5, 8) : 1 });
      }
      return {
        step: function (dt) {
          for (var i = parts.length - 1; i >= 0; i--) {
            var p = parts[i];
            p.life += dt;
            if (p.life >= p.max) { p.n.remove(); parts.splice(i, 1); continue; }
            p.x += p.vx * dt; p.y += p.vy * dt;
            p.vy = p.vy * Math.pow(0.94, 60 * dt) + 40 * dt;
            p.rot += p.vr * dt;
            var u = p.life / p.max;
            var fd = u < 0.1 ? u / 0.1 : Math.pow(1 - (u - 0.1) / 0.9, 1.6);
            var sz = Math.max(p.r * (1 - 0.4 * u), 0.5);
            p.n.setAttribute('opacity', fd.toFixed(2));
            p.n.setAttribute('transform', 'translate(' + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ') rotate(' + p.rot.toFixed(0) + ') scale(' + sz.toFixed(2) + ')');
          }
          return parts.length;
        },
        clear: function () { parts.forEach(function (p) { p.n.remove(); }); parts = []; }
      };
    }
    function starPath() {
      var pts = [];
      for (var e = 0; e < 10; e++) {
        var a = -Math.PI / 2 + e * Math.PI / 5;
        var r = e % 2 === 0 ? 1 : 0.42;
        pts.push((Math.cos(a) * r).toFixed(3) + ' ' + (Math.sin(a) * r).toFixed(3));
      }
      return 'M' + pts.join('L') + 'Z';
    }
    /* 睡眠 zzz */
    function makeZzz(layer) {
      var zs = [];
      for (var i = 0; i < 3; i++) {
        var t = svg('text', { x: 0, y: 0, fill: '#A8A296', opacity: 0, 'font-size': 20, 'font-weight': 700, 'font-style': 'italic', 'text-anchor': 'middle' });
        t.textContent = 'z';
        layer.appendChild(t);
        zs.push(t);
      }
      return {
        step: function (dt, now) {
          for (var i = 0; i < 3; i++) {
            var p = (now * 0.0004 + i / 3) % 1;
            var o = (p < 0.18 ? p / 0.18 : 1 - (p - 0.18) / 0.82) * 0.8;
            zs[i].setAttribute('opacity', o.toFixed(2));
            zs[i].setAttribute('font-size', (14 + p * 12).toFixed(0));
            zs[i].setAttribute('transform', 'translate(' + (60 + p * 40) + ' ' + (-62 - p * 46) + ')');
          }
        },
        clear: function () { zs.forEach(function (t) { t.remove(); }); }
      };
    }

    /* ---------------- 引擎 ---------------- */
    function createBall(el, opts) {
      opts = opts || {};
      var uid = 'gb' + (++seq);
      var autostart = opts.autostart !== false;

      var svgEl = svg('svg', { viewBox: '-130 -130 260 260', width: '100%', height: '100%', role: 'img' });
      svgEl.style.display = 'block';
      svgEl.style.overflow = 'visible';

      var defs = svg('defs', {});
      var grad = svg('radialGradient', { id: uid + 'g', cx: '38%', cy: '30%', r: '80%' });
      var stopA = svg('stop', { offset: '0%' });
      var stopB = svg('stop', { offset: '60%' });
      var stopC = svg('stop', { offset: '100%' });
      grad.appendChild(stopA); grad.appendChild(stopB); grad.appendChild(stopC);
      defs.appendChild(grad);
      svgEl.appendChild(defs);

      var fxBack = svg('g', {});
      svgEl.appendChild(fxBack);

      var bodyG = svg('g', {});
      var body = svg('circle', { r: 114, fill: 'url(#' + uid + 'g)' });
      bodyG.appendChild(body);
      var eyeL = svg('path', {});
      var eyeR = svg('path', {});
      bodyG.appendChild(eyeL);
      bodyG.appendChild(eyeR);
      svgEl.appendChild(bodyG);

      var fxFront = svg('g', {});
      svgEl.appendChild(fxFront);
      el.appendChild(svgEl);

      var ribbons = makeRibbons(defs, fxFront);
      var confetti = null, zzz = null, orbit = null;

      var P = { lx: -35, ly: -42, rx: 35, ry: -42 };
      var eyeColor = opts.eyeColor || '#1A1A1A';

      var cur = null, curColor = '#F3F0EA', targetColor = '#F3F0EA', colorFrom = '#F3F0EA', colorAt = 0;
      var gazeX = 0, gazeY = 0, gazeTX = 0, gazeTY = 0;
      var blinkStart = -1e9, blinkNext = 1e9, altBlink = false;
      var bornAt = performance.now();
      var shakeSeed = Math.random() * 100;
      var lastNow = 0, rafId = 0;
      var spin = { active: false, yaw: 0, vel: 0, acc: 0 };
      var anticNext = 1e9;
      var bounceAt = -1;

      function setBodyColor(c) {
        stopA.setAttribute('stop-color', tone(c, 0.22));
        stopB.setAttribute('stop-color', c);
        stopC.setAttribute('stop-color', tone(c, -0.14));
      }
      function eyeD(shapeKey, right) {
        var s = SHAPES[shapeKey] || SHAPES.open;
        return (s.dL != null ? (right ? s.dR : s.dL) : s.d);
      }
      function drawEye(path, shapeKey, right) {
        var s = SHAPES[shapeKey] || SHAPES.open;
        path.setAttribute('d', eyeD(shapeKey, right));
        if (s.stroke) {
          path.setAttribute('fill', 'none');
          path.setAttribute('stroke', eyeColor);
          path.setAttribute('stroke-width', s.stroke);
          path.setAttribute('stroke-linecap', 'round');
        } else {
          path.setAttribute('fill', eyeColor);
          path.setAttribute('stroke', 'none');
        }
      }

      function clearFx() {
        if (confetti) { confetti.clear(); confetti = null; }
        if (zzz) { zzz.clear(); zzz = null; }
        if (orbit) { ribbons.clear(); orbit = null; }
      }
      function startFx(e) {
        clearFx();
        if (e.fx === 'orbit') {
          orbit = true;
          ribbons.spawn({ lam: rand(0, TAU), vel: 1.9, span: 2.9, rx: 118, ry: 27, w: 7, hue: rand(0, 360), hueSpan: rand(70, 130), hueVel: 25, persistent: true });
        } else if (e.fx === 'zzz') {
          zzz = makeZzz(fxFront);
        } else if (e.fx === 'confetti') {
          confetti = makeConfetti(fxFront);
        }
      }

      function setEmotion(id) {
        var e = null;
        for (var i = 0; i < EMOTIONS.length; i++) if (EMOTIONS[i].id === id) e = EMOTIONS[i];
        if (!e) e = EMOTIONS[1] || EMOTIONS[0];
        cur = e;
        colorFrom = curColor;
        targetColor = e.color;
        colorAt = 0;
        blinkStart = -1e9;
        blinkNext = e.blink ? performance.now() + rand(e.blink[0], e.blink[1]) : 1e9;
        altBlink = !!e.altBlink;
        anticNext = e.antics ? performance.now() + rand(6000, 14000) : 1e9;
        bounceAt = -1;
        startFx(e);
        if (e.spin) doSpin(e.spin);
      }
      function doSpin(turns) {
        spin.active = true;
        spin.yaw = 0;
        spin.vel = (turns || 1) * 13;
        spin.acc = 0;
      }
      function setGaze(nx, ny) { gazeTX = clamp(nx, -1, 1); gazeTY = clamp(ny, -1, 1); }
      function clearGaze() { gazeTX = 0; gazeTY = 0; }

      function applyFrame(now, dt) {
        var e = cur || EMOTIONS[1];
        var t = now - bornAt;
        var rt = (now - blinkStart) / 1000;

        /* 待机小动作：随机自旋转圈甩彩带 */
        if (e.antics && now >= anticNext) {
          if (!spin.active) doSpin(rand(1, 2) | 0);
          anticNext = now + rand(8000, 16000);
        }

        /* 自旋推进 */
        var spinEyeX = 0, spinVis = 1, spinComp = 1;
        if (spin.active) {
          spin.yaw += spin.vel * dt;
          spin.vel *= Math.exp(-2.4 * dt);
          if (Math.abs(spin.vel) > 3.5) {
            spin.acc += dt;
            while (spin.acc > 0.12) {
              spin.acc -= 0.12;
              ribbons.spawn({
                lam: spin.yaw + rand(-0.4, 0.4),
                vel: (spin.vel > 0 ? 1 : -1) * rand(4, 7),
                span: rand(1.8, 2.8), rx: rand(112, 130), ry: rand(18, 30),
                w: rand(6, 9), hue: rand(0, 360), hueSpan: rand(60, 120), hueVel: rand(-40, 40),
                max: rand(1.4, 2.4)
              });
            }
          }
          if (Math.abs(spin.vel) < 0.25) spin.active = false;
          spinEyeX = Math.sin(spin.yaw) * 55;
          spinVis = Math.cos(spin.yaw) > 0.02 ? 1 : 0;
          spinComp = Math.max(Math.cos(spin.yaw), 0.04);
        }

        /* 注视平滑 */
        var k = 1 - Math.exp(-5.6 * dt);
        gazeX += (gazeTX - gazeX) * k;
        gazeY += (gazeTY - gazeY) * k;

        /* 颜色过渡 */
        colorAt = Math.min(colorAt + dt / 0.35, 1);
        curColor = colorAt >= 1 ? targetColor : mix(colorFrom, targetColor, colorAt);
        setBodyColor(curColor);
        if (opts.color) setBodyColor(opts.color);

        /* 眨眼 */
        if (e.blink && now >= blinkNext) {
          blinkStart = now;
          blinkNext = now + rand(e.blink[0], e.blink[1]);
        }
        var bd = e.blink ? (now - blinkStart) : 1e9;
        var blink = 1;
        if (bd < 160) blink = Math.abs(Math.sin(Math.PI * bd / 160));
        blink = Math.max(blink, 0.04);
        var blinkL = blink, blinkR = blink;
        if (altBlink) {
          blinkL = bd < 160 ? blink : 1;
          blinkR = (bd >= 160 && bd < 320) ? blink : (bd < 160 ? 1 : 1);
          if (bd >= 160 && bd < 320) blinkR = Math.max(Math.abs(Math.sin(Math.PI * bd / 160)), 0.04);
          else blinkR = bd < 160 ? 1 : blinkL;
        }

        /* 呼吸 / 浮动 / 抖动 / 摇头 / 弹跳 */
        var breathe = e.breathe || 0;
        var bs = 1 + breathe * Math.sin(now / 1000 * 1.15);
        var bob = e.bob ? e.bob * Math.sin(TAU * t / (e.bobPer || 1400)) : 0;
        var shake = e.shake ? e.shake * Math.exp(-rt * 2.2) * Math.sin(rt * 30 + shakeSeed) : 0;
        var nod = e.nod ? Math.sin(TAU * t / 1600) * 7 * Math.exp(-rt * 1.5) : 0;
        var bounceY = 0;
        if (bounceAt >= 0) {
          var be = (now - bounceAt) / 1000;
          if (be > 1.2) bounceAt = -1;
          else bounceY = -Math.abs(Math.sin(be * Math.PI * 2)) * 30 * (1 - be / 1.2);
        }

        /* 扫视 / 慌乱 */
        var scanX = 0, scanY = 0, dart = 0;
        if (e.scan) { var pp = (t % e.scanPer) / e.scanPer; scanX = e.scan * (pp < 0.5 ? pp * 4 - 1 : 3 - pp * 4); }
        if (e.scanY) scanY = e.scanY * Math.sin(TAU * t / e.scanPer);
        if (e.dart) dart = (Math.sin(t / 90) + Math.sin(t / 150)) / 2 * 4;

        var pulse = e.pulse ? 1 + e.pulse * 0.5 * (1 - Math.cos(TAU * t / e.pulsePer)) : 1;
        if (e.flash) {
          var fi = Math.floor(rt * 4) % e.flash.length;
          setBodyColor(e.flash[fi]);
        }

        var eyeScale = (e.scale || 1) * (opts.eyeScale || 1) * pulse;
        var gx = e.gaze === false ? 0 : (e.lookX || 0) + gazeX * 16 + scanX + dart + spinEyeX;
        var gy = e.gaze === false ? 0 : (e.lookY || 0) + gazeY * 11 + scanY;
        var compress = (1 - 0.08 * Math.abs(gx) / 16) * spinComp;

        var convL = e.focus ? 3 : 0, convR = e.focus ? -3 : 0;
        var tilt = (e.tilt || 0) + nod;

        bodyG.setAttribute('transform',
          'translate(' + (shake + (e.nod ? nod * 0.4 : 0)).toFixed(1) + ' ' + (bob + bounceY).toFixed(1) + ')' +
          ' rotate(' + tilt.toFixed(1) + ') scale(' + (bs * pulse).toFixed(3) + ')');

        function place(path, px, py, shapeKey, right, blk, cv) {
          drawEye(path, shapeKey, right);
          var sx = eyeScale * compress;
          if (right) sx = -sx;
          var sy = eyeScale * blk;
          path.setAttribute('opacity', spinVis);
          path.setAttribute('transform',
            'translate(' + (px + gx + cv).toFixed(1) + ' ' + (py + gy).toFixed(1) + ')' +
            ' scale(' + sx.toFixed(3) + ' ' + sy.toFixed(3) + ')');
        }
        place(eyeL, P.lx, P.ly, e.eyeL || e.eye, false, blinkL, convL);
        place(eyeR, P.rx, P.ry, e.eyeR || e.eye, true, blinkR, convR);

        ribbons.step(dt);
        if (confetti && confetti.step(dt) === 0) { confetti.clear(); confetti = null; }
        if (zzz) zzz.step(dt, now);
      }

      function loop(now) {
        var dt = lastNow ? clamp((now - lastNow) / 1000, 0.001, 0.05) : 1 / 60;
        lastNow = now;
        applyFrame(now, dt);
        rafId = requestAnimationFrame(loop);
      }

      setEmotion(opts.emotion || '02');
      if (autostart) rafId = requestAnimationFrame(loop);
      else applyFrame(performance.now(), 1 / 60);

      return {
        setEmotion: function (id) { setEmotion(id); },
        spin: function (turns) { doSpin(turns || 1); },
        setGaze: setGaze,
        clearGaze: clearGaze,
        destroy: function () {
          if (rafId) cancelAnimationFrame(rafId);
          clearFx();
          ribbons.clear();
          if (svgEl.parentNode) svgEl.parentNode.removeChild(svgEl);
        }
      };
    }

    window.GrokBall = { create: createBall, EMOTIONS: EMOTIONS, GROUPS: GROUPS };
  })();
  </script>

  <script>
  (function () {
    'use strict';
    var GROUPS = window.GrokBall.GROUPS;
    var EMOTIONS = window.GrokBall.EMOTIONS;

    var controlsEl = document.getElementById('controls');
    var previewBox = document.getElementById('previewBall');
    var cornerEl = document.getElementById('ball');
    var nameEl = document.getElementById('previewName');
    var idEl = document.getElementById('previewId');
    var descEl = document.getElementById('previewDesc');
    var colorMode = document.getElementById('colorMode');
    var colorInput = document.getElementById('colorInput');
    var sizeRange = document.getElementById('sizeRange');

    var currentId = '02';
    var engine = null;
    var cornerEngine = null;

    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function pickEye(hex) {
      var n = parseInt(hex.slice(1), 16);
      var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      return (0.299 * r + 0.587 * g + 0.114 * b) < 140 ? '#f5f5f5' : '#1a1a1a';
    }

    cornerEngine = GrokBall.create(cornerEl, { emotion: '02', color: '#1a1a1a', eyeColor: '#f5f5f5' });
    cornerEl.addEventListener('pointerdown', function () { cornerEngine.spin(1); });

    GROUPS.forEach(function (g) {
      var items = EMOTIONS.filter(function (s) { return s.group === g.key; });
      if (!items.length) return;
      var sec = document.createElement('div');
      sec.className = 'group';
      var h = document.createElement('h3');
      h.textContent = g.name;
      sec.appendChild(h);
      var grid = document.createElement('div');
      grid.className = 'emo-grid';
      items.forEach(function (s) {
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'emo-card';
        card.dataset.id = s.id;
        var thumb = document.createElement('div');
        thumb.className = 'emo-thumb';
        card.appendChild(thumb);
        var nm = document.createElement('span');
        nm.className = 'emo-name';
        nm.textContent = s.name;
        card.appendChild(nm);
        card.addEventListener('click', function () { select(s); });
        grid.appendChild(card);
        GrokBall.create(thumb, { emotion: s.id, autostart: false, eyeScale: 1.4 });
      });
      sec.appendChild(grid);
      controlsEl.appendChild(sec);
    });

    function rebuild() {
      var opts = { emotion: currentId };
      if (colorMode.value === 'custom') {
        opts.color = colorInput.value;
        opts.eyeColor = pickEye(colorInput.value);
      }
      if (engine) engine.destroy();
      engine = GrokBall.create(previewBox, opts);
    }

    function select(s) {
      currentId = s.id;
      var cards = controlsEl.querySelectorAll('.emo-card');
      for (var i = 0; i < cards.length; i++) cards[i].classList.toggle('active', cards[i].dataset.id === s.id);
      nameEl.textContent = s.name;
      idEl.textContent = 'ID ' + s.id;
      descEl.textContent = s.desc || '';
      if (engine && colorMode.value === 'auto') engine.setEmotion(s.id);
      else rebuild();
    }

    colorMode.addEventListener('change', rebuild);
    colorInput.addEventListener('change', function () { if (colorMode.value === 'custom') rebuild(); });
    sizeRange.addEventListener('input', function () {
      previewBox.style.width = sizeRange.value + 'px';
      previewBox.style.height = sizeRange.value + 'px';
    });

    function gazeOn(eng, el, e) {
      if (!eng) return;
      var r = el.getBoundingClientRect();
      if (!r.width || !r.height) return;
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      eng.setGaze(
        clamp((e.clientX - cx) / (r.width / 2), -1, 1),
        clamp((e.clientY - cy) / (r.height / 2), -1, 1));
    }
    window.addEventListener('pointermove', function (e) {
      gazeOn(engine, previewBox, e);
      gazeOn(cornerEngine, cornerEl, e);
    }, { passive: true });
    document.addEventListener('pointerleave', function () {
      if (engine) engine.clearGaze();
      if (cornerEngine) cornerEngine.clearGaze();
    });

    rebuild();
    var first = EMOTIONS.filter(function (s) { return s.id === currentId; })[0] || EMOTIONS[0];
    select(first);
  })();
  </script>
</body>
